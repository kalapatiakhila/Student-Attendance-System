
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Login - Student Attendance System</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            color: #1e3a8a;
            margin-top: 0;
        }

        .tabs {
            display: flex;
            margin-bottom: 22px;
            border-bottom: 1px solid #ddd;
        }

        .tabs button {
            width: 50%;
            padding: 12px;
            border: none;
            background: white;
            cursor: pointer;
            font-size: 16px;
        }

        .tabs button.active {
            color: #2563eb;
            border-bottom: 3px solid #2563eb;
            font-weight: bold;
        }

        .form-group { margin-bottom: 14px; }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            line-height: 1.5;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }

        .hidden { display: none; }
    </style>
</head>

<body>

<div class="container">

    <h2>Faculty Portal</h2>

    <div class="tabs">
        <button type="button" id="loginTab" class="active" onclick="showLogin()">Login</button>
        <button type="button" id="registerTab" onclick="showRegister()">Register</button>
    </div>

    <form id="loginForm">
        <div class="form-group">
            <label for="loginIdentifier">Email or Mobile Number</label>
            <input type="text" id="loginIdentifier" required
                   placeholder="Enter Email or Mobile Number">
        </div>

        <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" required
                   placeholder="Enter Password">
        </div>

        <button type="submit" class="submit-btn">Login</button>
    </form>

    <form id="registerForm" class="hidden">

        <div class="form-group">
            <label for="facultyName">Full Name</label>
            <input type="text" id="facultyName" required
                   placeholder="Enter Full Name">
        </div>

        <div class="form-group">
            <label for="facultyMobile">Mobile Number</label>
            <input type="tel" id="facultyMobile" maxlength="10"
                   pattern="[0-9]{10}" required
                   placeholder="Enter 10-digit Mobile Number">
        </div>

        <div class="form-group">
            <label for="facultyDepartment">Department</label>
            <input type="text" id="facultyDepartment" required
                   placeholder="Enter Department">
        </div>

        <div class="form-group">
            <label for="facultyEmail">Email</label>
            <input type="email" id="facultyEmail" required
                   placeholder="Enter Email Address">
        </div>

        <div class="form-group">
            <label for="registerPassword">Password</label>
            <input type="password" id="registerPassword"
                   minlength="6" required placeholder="Create Password">
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword"
                   minlength="6" required placeholder="Confirm Password">
        </div>

        <button type="submit" class="submit-btn">Register</button>
    </form>

    <p id="message"></p>

    <a href="index.html" class="home-link">Back to Home</a>

</div>

<script>
    // CORRECT RAILWAY BACKEND URL
    const API_URL =
        "https://student-attendance-system-production-d132.up.railway.app/api/faculty";

    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const message = document.getElementById("message");

    function showLogin() {
        loginForm.classList.remove("hidden");
        registerForm.classList.add("hidden");

        document.getElementById("loginTab").classList.add("active");
        document.getElementById("registerTab").classList.remove("active");

        message.textContent = "";
    }

    function showRegister() {
        registerForm.classList.remove("hidden");
        loginForm.classList.add("hidden");

        document.getElementById("registerTab").classList.add("active");
        document.getElementById("loginTab").classList.remove("active");

        message.textContent = "";
    }

    // REGISTER FACULTY
    registerForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        const name = document.getElementById("facultyName").value.trim();
        const mobile = document.getElementById("facultyMobile").value.trim();
        const department = document.getElementById("facultyDepartment").value.trim();
        const email = document.getElementById("facultyEmail").value.trim();
        const password = document.getElementById("registerPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (!/^[0-9]{10}$/.test(mobile)) {
            message.style.color = "red";
            message.textContent = "Enter a valid 10-digit mobile number.";
            return;
        }

        if (password.length < 6) {
            message.style.color = "red";
            message.textContent = "Password must contain at least 6 characters.";
            return;
        }

        if (password !== confirmPassword) {
            message.style.color = "red";
            message.textContent = "Passwords do not match.";
            return;
        }

        message.style.color = "#333";
        message.textContent = "Registering...";

        try {
            const response = await fetch(API_URL + "/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name,
                    mobile,
                    department,
                    email,
                    password
                })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || "Registration failed.");
            }

            message.style.color = "green";
            message.textContent =
                data.message +
                (data.facultyId ? " Your Faculty ID is: " + data.facultyId : "");

            registerForm.reset();

        } catch (error) {
            console.error("Faculty registration error:", error);
            message.style.color = "red";
            message.textContent = error.message;
        }
    });

    // FACULTY LOGIN
    loginForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        const identifier =
            document.getElementById("loginIdentifier").value.trim();

        const password =
            document.getElementById("loginPassword").value;

        message.style.color = "#333";
        message.textContent = "Logging in...";

        try {
            const response = await fetch(API_URL + "/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    identifier,
                    password
                })
            });

            const data = await response.json();

            if (!response.ok || !data.success ||
                !data.faculty || !data.faculty.id) {
                throw new Error(data.message || "Login failed.");
            }

            sessionStorage.setItem("facultyID", data.faculty.id);
            sessionStorage.setItem("facultyName", data.faculty.name || "");
            sessionStorage.setItem(
                "facultyDepartment",
                data.faculty.department || ""
            );

            message.style.color = "green";
            message.textContent = "Login successful!";

            window.location.href = "faculty-dashboard.html";

        } catch (error) {
            console.error("Faculty login error:", error);
            message.style.color = "red";
            message.textContent = error.message;
        }
    });
</script>

</body>
</html>
