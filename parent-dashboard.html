
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parent Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #07549b;
            color: white;
            text-align: center;
            padding: 22px;
        }

        .container {
            max-width: 1000px;
            margin: 25px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #0001;
        }

        select, button {
            padding: 11px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        select {
            width: 100%;
        }

        button {
            background: #07549b;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #063e73;
        }

        .logout {
            background: #dc2626;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .summary .card {
            text-align: center;
        }

        .summary h3 {
            font-size: 15px;
            color: #64748b;
        }

        .summary p {
            font-size: 25px;
            font-weight: bold;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 450px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #07549b;
            color: white;
        }

        .message {
            font-weight: bold;
            margin-top: 12px;
        }

        @media (max-width: 650px) {

            .summary {
                grid-template-columns: repeat(2, 1fr);
            }

            .container {
                padding: 12px;
            }

        }

    </style>

</head>

<body>

<header>

    <h1>Parent Dashboard</h1>

    <p>Student Attendance Management System</p>

</header>

<main class="container">

    <section class="card">

        <h2>Welcome, Parent!</h2>

        <label for="studentSelect">
            Select Your Child
        </label>

        <select id="studentSelect">

            <option value="">Select Student</option>

        </select>

        <p id="message" class="message"></p>

        <button type="button" class="logout" onclick="logout()">
            Logout
        </button>

    </section>

    <section class="card">

        <h2>Student Details</h2>

        <p>
            <strong>Name:</strong>
            <span id="studentName">-</span>
        </p>

        <p>
            <strong>Roll Number:</strong>
            <span id="studentRoll">-</span>
        </p>

        <p>
            <strong>Class:</strong>
            <span id="studentClass">-</span>
        </p>

    </section>

    <section class="summary">

        <div class="card">
            <h3>Total Days</h3>
            <p id="totalDays">0</p>
        </div>

        <div class="card">
            <h3>Present</h3>
            <p id="presentDays">0</p>
        </div>

        <div class="card">
            <h3>Absent</h3>
            <p id="absentDays">0</p>
        </div>

        <div class="card">
            <h3>Attendance %</h3>
            <p id="percentage">0%</p>
        </div>

    </section>

    <section class="card">

        <h2>Attendance Status</h2>

        <h3 id="attendanceStatus">
            No attendance recorded
        </h3>

    </section>

    <section class="card">

        <h2>Attendance History</h2>

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>
                        <th>S.No.</th>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>

                </thead>

                <tbody id="historyBody">

                    <tr>
                        <td colspan="3">
                            Select a student to view attendance.
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>

<script>

// RAILWAY BACKEND API
const API_URL =
    "https://student-attendance-system-production-d132.up.railway.app/api";

const ATTENDANCE_API = API_URL + "/attendance";

const studentSelect =
    document.getElementById("studentSelect");

const message =
    document.getElementById("message");

let parentStudents = [];

// LOAD STUDENTS FROM PARENT LOGIN
function loadParentStudents() {

    try {

        parentStudents = JSON.parse(
            sessionStorage.getItem("parentStudents") || "[]"
        );

        if (!Array.isArray(parentStudents) ||
            parentStudents.length === 0) {

            window.location.href = "parent-login.html";
            return;
        }

        studentSelect.innerHTML =
            '<option value="">Select Student</option>';

        parentStudents.forEach(student => {

            const option = document.createElement("option");

            option.value = student.id;

            option.textContent =
                student.name + " (" + student.roll_no + ")";

            studentSelect.appendChild(option);

        });

        message.textContent =
            "Parent login successful. Select your child.";

    } catch (error) {

        console.error(error);

        window.location.href = "parent-login.html";

    }

}

// LOAD ATTENDANCE FROM RAILWAY MYSQL
async function loadAttendance(studentId) {

    try {

        message.textContent = "Loading attendance...";

        const response = await fetch(
            ATTENDANCE_API +
            "/student/" +
            encodeURIComponent(studentId)
        );

        const text = await response.text();

        let data;

        try {

            data = text ? JSON.parse(text) : [];

        } catch {

            throw new Error("Invalid response from server.");

        }

        if (!response.ok) {

            throw new Error(
                data.message || "Unable to load attendance."
            );

        }

        const records = Array.isArray(data)
            ? data
            : (data.records || data.attendance || []);

        const student = parentStudents.find(
            item => String(item.id) === String(studentId)
        );

        if (!student) {

            throw new Error("Student not found.");

        }

        document.getElementById("studentName").textContent =
            student.name || "-";

        document.getElementById("studentRoll").textContent =
            student.roll_no || "-";

        document.getElementById("studentClass").textContent =
            student.student_class || "-";

        displayAttendance(records);

        message.textContent =
            "Attendance loaded successfully.";

    } catch (error) {

        console.error("Attendance error:", error);

        message.textContent = error.message;

        clearAttendance();

    }

}

// DISPLAY ATTENDANCE
function displayAttendance(records) {

    const historyBody =
        document.getElementById("historyBody");

    let present = 0;
    let absent = 0;

    records.forEach(record => {

        const status =
            String(record.status || "").toLowerCase();

        if (status === "present") present++;

        if (status === "absent") absent++;

    });

    const total = present + absent;

    const percentage = total > 0
        ? (present / total) * 100
        : 0;

    document.getElementById("totalDays").textContent =
        total;

    document.getElementById("presentDays").textContent =
        present;

    document.getElementById("absentDays").textContent =
        absent;

    document.getElementById("percentage").textContent =
        percentage.toFixed(1) + "%";

    let statusText = "No attendance recorded";

    if (total > 0) {

        if (percentage < 50) {

            statusText = "Detention Risk";

        } else if (percentage < 75) {

            statusText = "Condonation Required";

        } else {

            statusText = "Attendance Eligible";

        }

    }

    document.getElementById("attendanceStatus").textContent =
        statusText;

    historyBody.innerHTML = "";

    if (records.length === 0) {

        historyBody.innerHTML =
            '<tr><td colspan="3">No attendance records found.</td></tr>';

        return;

    }

    records.sort((a, b) =>
        String(b.attendance_date || "").localeCompare(
            String(a.attendance_date || "")
        )
    );

    records.forEach((record, index) => {

        const row = document.createElement("tr");

        const date = record.attendance_date
            ? String(record.attendance_date).slice(0, 10)
            : "-";

        const values = [
            index + 1,
            date,
            record.status || "-"
        ];

        values.forEach(value => {

            const cell = document.createElement("td");

            cell.textContent = value;

            row.appendChild(cell);

        });

        historyBody.appendChild(row);

    });

}

// CLEAR ATTENDANCE DETAILS
function clearAttendance() {

    document.getElementById("studentName").textContent = "-";

    document.getElementById("studentRoll").textContent = "-";

    document.getElementById("studentClass").textContent = "-";

    document.getElementById("totalDays").textContent = "0";

    document.getElementById("presentDays").textContent = "0";

    document.getElementById("absentDays").textContent = "0";

    document.getElementById("percentage").textContent = "0%";

    document.getElementById("attendanceStatus").textContent =
        "No attendance recorded";

    document.getElementById("historyBody").innerHTML =
        '<tr><td colspan="3">No attendance records found.</td></tr>';

}

// SELECT STUDENT
studentSelect.addEventListener("change", function() {

    const studentId = this.value;

    clearAttendance();

    if (!studentId) {

        message.textContent = "Please select a student.";

        return;

    }

    loadAttendance(studentId);

});

// LOGOUT
function logout() {

    sessionStorage.removeItem("parentStudents");

    sessionStorage.removeItem("parentMobile");

    window.location.href = "parent-login.html";

}

// INITIALIZE
loadParentStudents();

</script>

</body>

</html>
