<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>Student Attendance System</h2>
        <p>Smart Attendance Management Portal</p>
    </header>
    <main class="container">
        <h1>Welcome!</h1>
        <p>Select your login type</p>
        <div class="login-cards">
            <a href="admin-login.html" class="card">
                <h2>Admin</h2>
                <p>Manage students and faculty</p>
            </a>
            <a href="faculty-login.html" class="card">
                <h2>Faculty</h2>
                <p>Mark student attendance</p>
            </a>
            <a href="student-login.html" class="card">
                <h2>Student</h2>
                <p>View your own attendance</p>
            </a>

            <a href="parent-login.html" class="card">
                <h2>Parent</h2>
                <p>View your child's attendance</p>
            </a>
        </div>
    </main>
    <footer>
        <p>Student Attendance Management System</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
