
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Student Attendance System</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f3f6fb;
            color: #222;
        }

        header {
            background: #243b64;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            padding: 22px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000012;
        }

        h2 {
            color: #243b64;
        }

        .details p {
            font-size: 16px;
            margin: 12px 0;
        }

        button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #c0392b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #243b64;
            color: white;
        }

        .present {
            color: green;
            font-weight: bold;
        }

        .absent {
            color: red;
            font-weight: bold;
        }

        .message {
            color: #555;
            margin-top: 12px;
        }

        .error {
            color: #c0392b;
        }

        @media (max-width: 600px) {
            table {
                font-size: 13px;
            }

            th, td {
                padding: 8px;
            }

            .card {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Student Dashboard</h1>
    <button onclick="logout()">Logout</button>
</header>

<main>

    <!-- STUDENT PROFILE -->
    <section class="card">
        <h2>Student Profile</h2>

        <div class="details">
            <p><strong>Name:</strong>
                <span id="studentName">Loading...</span>
            </p>

            <p><strong>Roll Number:</strong>
                <span id="rollNumber">Loading...</span>
            </p>

            <p><strong>Class:</strong>
                <span id="studentClass">Loading...</span>
            </p>
        </div>
    </section>

    <!-- ATTENDANCE SUMMARY -->
    <section class="card">
        <h2>Attendance Summary</h2>

        <p><strong>Total Classes:</strong>
            <span id="totalClasses">--</span>
        </p>

        <p><strong>Present:</strong>
            <span id="presentDays">--</span>
        </p>

        <p><strong>Absent:</strong>
            <span id="absentDays">--</span>
        </p>

        <p><strong>Attendance Percentage:</strong>
            <span id="percentage">--</span>
        </p>
    </section>

    <!-- ATTENDANCE HISTORY -->
    <section class="card">
        <h2>Attendance History</h2>

        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="attendanceTable">
                <tr>
                    <td colspan="2">Loading attendance...</td>
                </tr>
            </tbody>
        </table>

        <p id="message" class="message"></p>
    </section>

</main>

<script>

    // RAILWAY BACKEND URL
    const API_URL =
        "https://student-attendance-system-production-d132.up.railway.app/api";

    // STUDENT LOGIN DETAILS
    const studentRoll = sessionStorage.getItem("studentRoll");
    const studentToken = sessionStorage.getItem("studentToken");

    // LOGOUT
    function logout() {

        sessionStorage.removeItem("studentToken");
        sessionStorage.removeItem("studentName");
        sessionStorage.removeItem("studentRoll");

        window.location.href = "student-login.html";
    }

    // READ API RESPONSE
    async function readResponse(response) {

        const text = await response.text();

        if (!text) {
            throw new Error("The server returned an empty response.");
        }

        let data;

        try {
            data = JSON.parse(text);
        } catch {
            throw new Error("Invalid response received from server.");
        }

        if (!response.ok) {
            throw new Error(
                data.message || "Unable to connect to the server."
            );
        }

        return data;
    }

    // SHOW MESSAGE
    function showMessage(text, isError = false) {

        const message = document.getElementById("message");

        message.textContent = text;

        message.className = isError
            ? "message error"
            : "message";
    }

    // FORMAT ATTENDANCE DATE
    function formatDate(value) {

        if (!value) {
            return "Date unavailable";
        }

        const dateString = String(value).substring(0, 10);

        const parts = dateString.split("-");

        if (parts.length === 3) {
            return `${parts[2]}-${parts[1]}-${parts[0]}`;
        }

        return dateString;
    }

    // LOAD STUDENT DASHBOARD
    async function loadDashboard() {

        if (!studentRoll || !studentToken) {

            alert("Please login first.");

            window.location.href = "student-login.html";

            return;
        }

        showMessage("Loading student details...");

        try {

            // GET STUDENTS FROM RAILWAY
            const response = await fetch(`${API_URL}/students`);

            const data = await readResponse(response);

            const students = Array.isArray(data)
                ? data
                : data.students;

            if (!Array.isArray(students)) {
                throw new Error("Invalid student data received.");
            }

            // FIND LOGGED-IN STUDENT USING ROLL NUMBER
            const student = students.find(item =>
                String(item.roll_no).trim().toLowerCase() ===
                String(studentRoll).trim().toLowerCase()
            );

            if (!student) {
                throw new Error("Student record not found.");
            }

            // DISPLAY STUDENT DETAILS
            document.getElementById("studentName").textContent =
                student.name || "";

            document.getElementById("rollNumber").textContent =
                student.roll_no || "";

            document.getElementById("studentClass").textContent =
                student.student_class || "";

            // LOAD ATTENDANCE
            await loadAttendance(student.id);

        } catch (error) {

            console.error("Student dashboard error:", error);

            showMessage(error.message, true);
        }
    }

    // LOAD ATTENDANCE HISTORY
    async function loadAttendance(studentId) {

        const table = document.getElementById("attendanceTable");

        try {

            const response = await fetch(
                `${API_URL}/attendance/student/${studentId}`
            );

            const data = await readResponse(response);

            // YOUR BACKEND RETURNS A DIRECT ARRAY
            const records = Array.isArray(data)
                ? data
                : (Array.isArray(data.records) ? data.records : []);

            // CALCULATE ATTENDANCE
            const present = records.filter(record =>
                String(record.status).toLowerCase() === "present"
            ).length;

            const absent = records.filter(record =>
                String(record.status).toLowerCase() === "absent"
            ).length;

            const total = records.length;

            const percentage = total > 0
                ? ((present / total) * 100).toFixed(2)
                : "0.00";

            // DISPLAY SUMMARY
            document.getElementById("totalClasses").textContent = total;

            document.getElementById("presentDays").textContent = present;

            document.getElementById("absentDays").textContent = absent;

            document.getElementById("percentage").textContent =
                percentage + "%";

            // CLEAR OLD TABLE
            table.innerHTML = "";

            if (records.length === 0) {

                table.innerHTML = `
                    <tr>
                        <td colspan="2">
                            No attendance records found.
                        </td>
                    </tr>
                `;

                showMessage("No attendance records available yet.");

                return;
            }

            // DISPLAY ATTENDANCE RECORDS
            records.forEach(record => {

                const row = document.createElement("tr");

                const dateCell = document.createElement("td");

                const statusCell = document.createElement("td");

                dateCell.textContent =
                    formatDate(record.attendance_date);

                statusCell.textContent =
                    record.status || "Unknown";

                const status = String(record.status).toLowerCase();

                if (status === "present") {
                    statusCell.className = "present";
                } else if (status === "absent") {
                    statusCell.className = "absent";
                }

                row.appendChild(dateCell);

                row.appendChild(statusCell);

                table.appendChild(row);
            });

            showMessage("Attendance loaded successfully!");

        } catch (error) {

            console.error("Attendance loading error:", error);

            table.innerHTML = `
                <tr>
                    <td colspan="2">
                        Attendance history is not available.
                    </td>
                </tr>
            `;

            showMessage(error.message, true);
        }
    }

    // START DASHBOARD
    loadDashboard();

</script>

</body>
</html>
