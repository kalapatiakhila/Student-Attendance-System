
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Dashboard - Student Attendance System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h2 {
            color: #243b55;
        }

        select, input, button {
            padding: 10px;
            margin: 8px 5px 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            cursor: pointer;
            background: #2563eb;
            color: white;
            border: none;
        }

        button:hover {
            background: #1d4ed8;
        }

        .logout {
            background: #dc2626;
        }

        .logout:hover {
            background: #b91c1c;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #e9efff;
        }

        .summary {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .summary div {
            background: #e9efff;
            padding: 15px;
            border-radius: 8px;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .controls {
            margin-top: 15px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 12px;
            }

            table {
                font-size: 13px;
            }

            th, td {
                padding: 8px;
            }

            select, input, button {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Faculty Dashboard</h2>

    <p>Welcome, <strong id="facultyName"></strong></p>
    <p>Faculty ID: <strong id="facultyID"></strong></p>
    <p>Department: <strong id="facultyDepartment"></strong></p>

    <button class="logout" onclick="logout()">Logout</button>

    <hr>

    <h3>Mark Student Attendance</h3>

    <label for="classSelect">Select Class:</label>
    <select id="classSelect">
        <option value="">Select Class</option>
    </select>

    <br>

    <label for="attendanceDate">Date:</label>
    <input type="date" id="attendanceDate">

    <div class="controls">
        <button type="button" onclick="markAll('Present')">
            All Present
        </button>

        <button type="button" onclick="markAll('Absent')">
            All Absent
        </button>
    </div>

    <div class="summary">
        <div>Total: <strong id="total">0</strong></div>
        <div>Present: <strong id="present">0</strong></div>
        <div>Absent: <strong id="absent">0</strong></div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Roll Number</th>
                <th>Student Name</th>
                <th>Attendance Status</th>
            </tr>
        </thead>

        <tbody id="studentTable">
            <tr>
                <td colspan="3">Select a class to load students.</td>
            </tr>
        </tbody>
    </table>

    <button type="button" onclick="saveAttendance()">
        Save Attendance
    </button>

    <p id="message"></p>

</div>

<script>
    // RAILWAY BACKEND API URL
    const API = "https://student-attendance-system-production-d132.up.railway.app/api";

    // FACULTY DETAILS
    const facultyID = sessionStorage.getItem("facultyID");
    const facultyName = sessionStorage.getItem("facultyName");
    const facultyDepartment = sessionStorage.getItem("facultyDepartment");

    let students = [];

    // CHECK FACULTY LOGIN
    if (!facultyID) {
        alert("Please login first.");
        window.location.href = "faculty-login.html";
    } else {
        initializeDashboard();
    }

    // INITIALIZE DASHBOARD
    function initializeDashboard() {

        document.getElementById("facultyID").textContent = facultyID;
        document.getElementById("facultyName").textContent =
            facultyName || "";

        document.getElementById("facultyDepartment").textContent =
            facultyDepartment || "";

        // SET TODAY'S DATE
        const today = new Date();

        const localDate = new Date(
            today.getTime() - today.getTimezoneOffset() * 60000
        ).toISOString().split("T")[0];

        document.getElementById("attendanceDate").value = localDate;

        // LOAD CLASSES
        loadClasses();

        // CLASS CHANGE EVENT
        document.getElementById("classSelect")
            .addEventListener("change", loadStudents);
    }

    // LOGOUT
    function logout() {
        sessionStorage.removeItem("facultyID");
        sessionStorage.removeItem("facultyName");
        sessionStorage.removeItem("facultyDepartment");

        window.location.href = "faculty-login.html";
    }

    // API REQUEST HELPER
    async function apiRequest(url, options = {}) {

        const response = await fetch(url, options);

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.message || "Server request failed."
            );
        }

        return data;
    }

    // LOAD CLASSES FROM DATABASE
    async function loadClasses() {

        const classSelect = document.getElementById("classSelect");

        showMessage("Loading classes...", "#333");

        try {

            const data = await apiRequest(`${API}/students`);

            if (!Array.isArray(data)) {
                throw new Error("Invalid student data received from server.");
            }

            const classes = [
                ...new Set(
                    data.map(student => student.student_class).filter(Boolean)
                )
            ];

            classSelect.innerHTML =
                '<option value="">Select Class</option>';

            classes.forEach(className => {

                const option = document.createElement("option");

                option.value = className;
                option.textContent = className;

                classSelect.appendChild(option);
            });

            if (classes.length === 0) {
                showMessage("No student classes found.", "red");
            } else {
                showMessage("Classes loaded successfully.", "green");
            }

        } catch (error) {

            console.error("Load classes error:", error);

            showMessage(
                "Unable to load classes: " + error.message,
                "red"
            );
        }
    }

    // LOAD STUDENTS BASED ON SELECTED CLASS
    async function loadStudents() {

        const selectedClass =
            document.getElementById("classSelect").value;

        const table =
            document.getElementById("studentTable");

        if (!selectedClass) {

            students = [];

            table.innerHTML =
                '<tr><td colspan="3">Select a class.</td></tr>';

            updateSummary();
            return;
        }

        table.innerHTML =
            '<tr><td colspan="3">Loading students...</td></tr>';

        try {

            const data = await apiRequest(`${API}/students`);

            if (!Array.isArray(data)) {
                throw new Error("Invalid student data received.");
            }

            students = data.filter(
                student => student.student_class === selectedClass
            );

            if (students.length === 0) {

                table.innerHTML =
                    '<tr><td colspan="3">No students found in this class.</td></tr>';

                updateSummary();
                return;
            }

            table.innerHTML = students.map(student => `
                <tr>
                    <td>${escapeHTML(student.roll_no)}</td>
                    <td>${escapeHTML(student.name)}</td>
                    <td>
                        <select class="status"
                                data-id="${Number(student.id)}">
                            <option value="Present">Present</option>
                            <option value="Absent">Absent</option>
                        </select>
                    </td>
                </tr>
            `).join("");

            document.querySelectorAll(".status").forEach(select => {

                select.addEventListener("change", updateSummary);

            });

            updateSummary();

            showMessage(
                students.length + " students loaded successfully.",
                "green"
            );

        } catch (error) {

            console.error("Load students error:", error);

            students = [];

            table.innerHTML =
                '<tr><td colspan="3">Unable to load students.</td></tr>';

            updateSummary();

            showMessage(error.message, "red");
        }
    }

    // PREVENT HTML INJECTION
    function escapeHTML(value) {

        return String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[char]);
    }

    // MARK ALL STUDENTS
    function markAll(status) {

        document.querySelectorAll(".status").forEach(select => {
            select.value = status;
        });

        updateSummary();
    }

    // UPDATE ATTENDANCE SUMMARY
    function updateSummary() {

        const selects = [
            ...document.querySelectorAll(".status")
        ];

        document.getElementById("total").textContent =
            selects.length;

        document.getElementById("present").textContent =
            selects.filter(select => select.value === "Present").length;

        document.getElementById("absent").textContent =
            selects.filter(select => select.value === "Absent").length;
    }

    // SAVE ATTENDANCE TO RAILWAY DATABASE
    async function saveAttendance() {

        const date =
            document.getElementById("attendanceDate").value;

        if (!date) {
            showMessage("Please select a date.", "red");
            return;
        }

        if (!facultyID || !Number.isInteger(Number(facultyID))) {
            showMessage(
                "Invalid faculty login. Please login again.",
                "red"
            );
            return;
        }

        if (students.length === 0) {
            showMessage(
                "Please select a class with students.",
                "red"
            );
            return;
        }

        const records = [
            ...document.querySelectorAll(".status")
        ].map(select => ({
            studentId: Number(select.dataset.id),
            status: select.value
        }));

        if (records.length !== students.length) {
            showMessage(
                "Please load the students again.",
                "red"
            );
            return;
        }

        const saveButton = document.querySelector(
            'button[onclick="saveAttendance()"]'
        );

        saveButton.disabled = true;
        saveButton.textContent = "Saving...";

        try {

            const data = await apiRequest(`${API}/attendance/save`, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    date: date,
                    facultyId: Number(facultyID),
                    records: records
                })
            });

            if (!data.success) {
                throw new Error(
                    data.message || "Attendance could not be saved."
                );
            }

            showMessage(
                data.message || "Attendance saved successfully!",
                "green"
            );

        } catch (error) {

            console.error("Save attendance error:", error);

            showMessage(
                error.message || "Server connection failed.",
                "red"
            );

        } finally {

            saveButton.disabled = false;
            saveButton.textContent = "Save Attendance";
        }
    }

    // DISPLAY MESSAGES
    function showMessage(message, color) {

        const element = document.getElementById("message");

        element.textContent = message;
        element.style.color = color;
    }

</script>

</body>
</html>
