
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8efff, #f5f7ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        h2 { text-align: center; color: #2563eb; }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover { background: #1d4ed8; }
        .register-btn { background: #16a34a; }
        .register-btn:hover { background: #15803d; }
        .hidden { display: none; }
        .message { text-align: center; margin-top: 12px; }
        .switch { text-align: center; margin-top: 18px; }
        a { color: #2563eb; cursor: pointer; text-decoration: none; }
        .back { text-align: center; margin-top: 20px; }
    </style>
</head>

<body>
<div class="container">

    <div id="loginForm">
        <h2>Student Login</h2>
        <p class="subtitle">Student Attendance Management System</p>

        <form id="login">
            <input type="text" id="loginRoll"
                   placeholder="Enter Roll Number" required>

            <input type="password" id="loginPassword"
                   placeholder="Enter Password" required>

            <button type="submit">Login</button>
        </form>

        <div id="loginMessage" class="message"></div>
        <hr>

        <p class="switch">New Student?</p>

        <button type="button" class="register-btn"
                onclick="showRegister()">Register Here</button>
    </div>

    <div id="registerForm" class="hidden">
        <h2>Student Registration</h2>
        <p class="subtitle">Create Your Student Account</p>

        <form id="register">
            <input type="text" id="regName"
                   placeholder="Enter Full Name" required>

            <input type="text" id="regRoll"
                   placeholder="Enter Roll Number" required>

            <input type="email" id="regEmail"
                   placeholder="Enter Email Address" required>

            <input type="password" id="regPassword"
                   placeholder="Create Password (minimum 8 characters)"
                   minlength="8" required>

            <input type="password" id="confirmPassword"
                   placeholder="Confirm Password"
                   minlength="8" required>

            <button type="submit" class="register-btn">Register</button>
        </form>

        <div id="registerMessage" class="message"></div>

        <p class="switch">
            Already Registered?
            <a href="#" onclick="showLogin(); return false;">Login Here</a>
        </p>
    </div>

    <p class="back"><a href="index.html">Back to Home</a></p>
</div>

<script>
const API_URL =
    "https://student-attendance-system-production-d132.up.railway.app/api/students";

function showRegister() {
    document.getElementById("loginForm").classList.add("hidden");
    document.getElementById("registerForm").classList.remove("hidden");
}

function showLogin() {
    document.getElementById("registerForm").classList.add("hidden");
    document.getElementById("loginForm").classList.remove("hidden");
}

async function readResponse(response) {
    const text = await response.text();

    let data;

    try {
        data = text ? JSON.parse(text) : {};
    } catch (error) {
        throw new Error("Invalid server response. Please check the backend.");
    }

    if (!response.ok || data.success === false) {
        throw new Error(data.message || "Request failed.");
    }

    return data;
}

// STUDENT REGISTRATION
document.getElementById("register").addEventListener("submit", async function(event) {
    event.preventDefault();

    const name = document.getElementById("regName").value.trim();
    const roll_number = document.getElementById("regRoll").value.trim();
    const email = document.getElementById("regEmail").value.trim();
    const password = document.getElementById("regPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    const message = document.getElementById("registerMessage");

    if (password.length < 8) {
        message.style.color = "red";
        message.textContent = "Password must contain at least 8 characters.";
        return;
    }

    if (password !== confirmPassword) {
        message.style.color = "red";
        message.textContent = "Passwords do not match.";
        return;
    }

    try {
        const response = await fetch(`${API_URL}/register`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name,
                roll_number,
                email,
                password
            })
        });

        const data = await readResponse(response);

        message.style.color = "green";
        message.textContent = data.message || "Registration successful.";

        document.getElementById("register").reset();

        setTimeout(showLogin, 1500);

    } catch (error) {
        console.error("Registration error:", error);

        message.style.color = "red";
        message.textContent = error.message;
    }
});

// STUDENT LOGIN
document.getElementById("login").addEventListener("submit", async function(event) {
    event.preventDefault();

    const roll_number = document.getElementById("loginRoll").value.trim();
    const password = document.getElementById("loginPassword").value;

    const message = document.getElementById("loginMessage");

    try {
        const response = await fetch(`${API_URL}/login`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                roll_number,
                password
            })
        });

        const data = await readResponse(response);

        if (!data.student || !data.student.roll_no || !data.token) {
            throw new Error("Student login response is incomplete.");
        }

        // Save student details for the dashboard
        sessionStorage.setItem("studentToken", data.token);
        sessionStorage.setItem("studentName", data.student.name || "");
        sessionStorage.setItem("studentRoll", data.student.roll_no);

        sessionStorage.setItem("studentID", data.student.id);

        message.style.color = "green";
        message.textContent = "Login successful!";

        window.location.href = "student-dashboard.html";

    } catch (error) {
        console.error("Login error:", error);

        message.style.color = "red";
        message.textContent = error.message;
    }
});
</script>

</body>
</html>
